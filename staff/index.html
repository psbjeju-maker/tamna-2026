<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0F1120">
<title>신 위치 공유 — 스태프 전용</title>
<style>
@font-face{font-family:SCDream;src:url(../fonts/SCDream4.woff)format('woff');font-weight:400;font-display:swap}
@font-face{font-family:SCDream;src:url(../fonts/SCDream5.woff)format('woff');font-weight:600;font-display:swap}
@font-face{font-family:SCDream;src:url(../fonts/SCDream7.woff)format('woff');font-weight:800;font-display:swap}
:root{
  --ink:#0F1120; --gold:#F5B331; --coral:#F0605A; --teal:#4FC3A1;
  --txt:#F2F0EA; --dim:#B8B5C6; --line:rgba(245,179,49,.22);
  --safe: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:SCDream,-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
  background:radial-gradient(1200px 700px at 50% -10%,#2A2F4A 0%,transparent 60%),
    linear-gradient(180deg,#0F1120 0%,#12142A 45%,#0F1120 100%);
  background-attachment:fixed;color:var(--txt);min-height:100dvh}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:460px;margin:0 auto;padding:20px 18px calc(30px + var(--safe))}
h1{font-size:19px;font-weight:800;margin:6px 0 4px}
.eyebrow{font-size:11px;letter-spacing:.08em;color:var(--gold);font-weight:800}
.warn{border:1px solid rgba(245,179,49,.3);background:rgba(245,179,49,.08);border-radius:13px;
  padding:13px 15px;font-size:12.5px;line-height:1.7;color:#F8DFA8;margin:14px 0}
.warn b{color:var(--gold)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:16px;margin-bottom:14px}
.godgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.godbtn{padding:12px 8px;border-radius:12px;background:rgba(255,255,255,.05);
  border:1.5px solid rgba(255,255,255,.12);font-size:13px;font-weight:700;text-align:center}
.godbtn.on{background:rgba(245,179,49,.14);border-color:var(--gold);color:var(--gold)}
.toggle{display:block;width:100%;padding:20px;border-radius:16px;font-weight:800;font-size:17px;
  text-align:center;margin-top:16px;transition:.15s}
.toggle.off{background:linear-gradient(180deg,#9FE3CB,#3FAE8F);color:#0A2226}
.toggle.on{background:linear-gradient(180deg,#F58C87,#B8433E);color:#2A0E22;
  animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,96,90,.4)}50%{box-shadow:0 0 0 14px rgba(240,96,90,0)}}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.mode{display:flex;flex-direction:column;gap:6px;align-items:center;padding:16px 6px;border-radius:16px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);color:var(--txt);min-height:110px}
.mode b{font-size:17px}
.mode small{font-size:11.5px;color:var(--dim);line-height:1.45}
.mode.on[data-mode=move]{border-color:var(--teal);background:rgba(79,195,161,.16)}
.mode.on[data-mode=fixed]{border-color:var(--gold);background:rgba(245,179,49,.16)}
.mode.on[data-mode=off]{border-color:var(--coral);background:rgba(240,96,90,.14)}
.mode:disabled{opacity:.5}
.status{text-align:center;font-size:12px;color:var(--dim);margin-top:10px;line-height:1.6}
.status b{color:var(--txt)}
.adminlink{display:block;text-align:center;margin-top:22px;font-size:11.5px;color:var(--dim);text-decoration:none}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:99;
  background:rgba(10,31,49,.97);border:1px solid var(--line);color:var(--txt);padding:12px 20px;border-radius:99px;
  font-size:13px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;text-align:center;
  max-width:88vw;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">탐라문화제 · STAFF ONLY</div>
  <h1>신 위치 공유</h1>

  <div class="warn">
    <b>이 페이지는 손님용이 아닙니다.</b> 실제 위치를 약 <b id="fuzzTxt">25m</b> 오차로 흐려서 참가자 앱에 방향 힌트로만 보여 줍니다.<br>
    <b>이동 모드</b> 걸을 때 · 화면 켜 두기 &nbsp;/&nbsp; <b>고정 모드</b> 한 자리에 있을 때 · 한 번 보내면 화면 꺼도 유지 &nbsp;/&nbsp; <b>쉬기</b> 위치 끄기
  </div>

  <div class="card">
    <div style="font-size:13px;font-weight:700;margin-bottom:8px">나는 어떤 신인가요?</div>
    <div class="godgrid" id="godGrid"></div>
  </div>

  <div class="modes">
    <button class="mode" data-mode="move"><b>이동 모드</b><small>걸어 다니는 동안 실시간 전송<br>화면을 켜 두세요</small></button>
    <button class="mode" data-mode="fixed"><b>고정 모드</b><small>지금 자리에 한 번 고정<br>화면 꺼져도 유지</small></button>
    <button class="mode" data-mode="off"><b>쉬기</b><small>위치 끄기<br>참가자에게 안 보임</small></button>
  </div>
  <div class="status" id="statusTxt">꺼져 있음 · 참가자에게 위치가 안 보입니다</div>

</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="../config.js"></script>
<script src="../live.js"></script>
<script>
(function(){
'use strict';
var C = window.TAMNA, L = window.TamnaLive;
var $ = function(s){return document.querySelector(s)};
var KEY = 'tamna_staff_god';

$('#fuzzTxt').textContent = (C.liveLocation.fuzzMeters||25)+'m';

/* ---- 신 선택 ---- */
var selected = localStorage.getItem(KEY) || (C.crew[0] && C.crew[0].id);
function paintGrid(){
  var g=$('#godGrid');g.innerHTML='';
  C.crew.forEach(function(c){
    var b=document.createElement('button');
    b.className='godbtn'+(c.id===selected?' on':'');
    b.textContent=c.name;
    b.onclick=function(){
      if(mode!=='off'){toast('먼저 「쉬기」를 누르고 신을 바꿔 주세요');return}
      selected=c.id;localStorage.setItem(KEY,selected);paintGrid();
    };
    g.appendChild(b);
  });
}
paintGrid();

function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on')},2400)}

/* ---- 위치 전송: 이동 / 고정 / 쉬기 (2026-10-12) ----
   이동 = watchPosition 으로 계속 전송(화면 켜 둠, 꺼짐 방지 요청).
   고정 = 위치를 몇 초 모아 가장 정확한 값 한 번만 보내고 끝(mode:'fixed'). 화면이 꺼지거나 다른 앱을 켜도 그 위치가 유지된다.
   쉬기 = active:false 로 지움. 마지막 모드는 이 폰에 기억해 둔다(다시 열면 표시만 복원, 이동 모드면 전송 재개). */
var MODE_KEY='tamna_staff_mode';
var watchId=null, lastSent=0, mode='off', wake=null, fixBusy=false;
var UPDATE_MS = C.liveLocation.updateMs||8000;
var FUZZ = C.liveLocation.fuzzMeters||25;

function godName(){var c=C.crew.filter(function(x){return x.id===selected})[0];return c?c.name:selected}
function hhmm(){return new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function paintModes(){
  document.querySelectorAll('.mode').forEach(function(b){b.classList.toggle('on',b.dataset.mode===mode)});
}
function setMode(m){mode=m;try{localStorage.setItem(MODE_KEY,JSON.stringify({mode:m,god:selected}))}catch(e){}paintModes()}
function stopWatch(){if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null}}
function keepAwake(on){
  try{
    if(on&&navigator.wakeLock&&!wake)navigator.wakeLock.request('screen').then(function(w){wake=w;w.addEventListener('release',function(){wake=null})},function(){});
    if(!on&&wake){wake.release();wake=null}
  }catch(e){}
}
function canGeo(){
  if(!navigator.geolocation){toast('이 기기/브라우저는 위치 기능을 지원하지 않습니다');return false}
  if(!L.hasDb()){toast('서버 연결 실패 — 오프라인이거나 설정 오류입니다');return false}
  return true;
}
function onPos(pos){
  if(mode!=='move')return;
  var now=Date.now();
  if(now-lastSent<UPDATE_MS)return;
  lastSent=now;
  var f=L.fuzz(pos.coords.latitude,pos.coords.longitude,FUZZ);
  L.setLive(selected,f.lat,f.lng,true,{name:godName(),mode:'move'}).then(function(ok){
    $('#statusTxt').innerHTML=ok?'🟢 이동 모드 · <b>'+hhmm()+'</b> 마지막 전송 · 화면을 켜 두세요':'⚠️ 전송 실패 — 네트워크를 확인하세요';
  });
}
function onPosErr(err){
  toast('위치 권한이 필요합니다: '+(err&&err.message?err.message:'알 수 없는 오류'));
  if(mode==='move')goOff();
}
function goMove(){
  if(!canGeo())return;
  setMode('move');lastSent=0;stopWatch();keepAwake(true);
  $('#statusTxt').textContent='이동 모드 · 위치 요청 중…';
  watchId=navigator.geolocation.watchPosition(onPos,onPosErr,{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
}
function goFixed(){
  if(!canGeo()||fixBusy)return;
  fixBusy=true;stopWatch();keepAwake(false);
  $('#statusTxt').textContent='📍 지금 자리를 잡는 중… (몇 초)';
  var best=null, t0=Date.now(), wid=null;
  function done(){
    if(wid!=null)navigator.geolocation.clearWatch(wid);
    fixBusy=false;
    if(!best){toast('위치를 못 잡았어요. 밖이 보이는 곳에서 다시 눌러 주세요');paintModes();return}
    var f=L.fuzz(best.coords.latitude,best.coords.longitude,FUZZ);
    L.setLive(selected,f.lat,f.lng,true,{name:godName(),mode:'fixed'}).then(function(ok){
      if(!ok){$('#statusTxt').textContent='⚠️ 전송 실패 — 네트워크를 확인하고 다시 눌러 주세요';return}
      setMode('fixed');
      $('#statusTxt').innerHTML='📍 고정 모드 · <b>'+hhmm()+'</b> 위치로 고정됨<br>이제 화면을 꺼도 되고 다른 앱을 써도 돼요. 움직이면 「이동 모드」를 눌러 주세요.';
    });
  }
  /* 4초 동안 모아 정확도가 가장 좋은 값을 쓴다(첫 값은 부정확한 경우가 많음) */
  wid=navigator.geolocation.watchPosition(function(p){
    if(!best||p.coords.accuracy<best.coords.accuracy)best=p;
    if(Date.now()-t0>4000||(best&&best.coords.accuracy<=15))done();
  },function(e){wid=null;fixBusy=false;toast('위치 권한이 필요합니다: '+(e&&e.message||''));},{enableHighAccuracy:true,maximumAge:0,timeout:15000});
  setTimeout(function(){if(fixBusy)done()},7000);
}
function goOff(){
  stopWatch();keepAwake(false);setMode('off');
  $('#statusTxt').textContent='꺼져 있음 · 참가자에게 위치가 안 보입니다';
  L.setLive(selected,null,null,false,{name:godName(),mode:'off'});
}
document.querySelectorAll('.mode').forEach(function(b){b.onclick=function(){
  var m=b.dataset.mode;
  if(m==='move')goMove();else if(m==='fixed')goFixed();else goOff();
}});
/* 이동 모드에서 다른 앱 갔다 오면 바로 다시 보내고 꺼짐 방지도 다시 요청 */
document.addEventListener('visibilitychange',function(){
  if(document.hidden||mode!=='move')return;
  lastSent=0;keepAwake(true);
  if(watchId==null)goMove();
  toast('이동 모드 다시 전송 중');
});
/* 다시 열었을 때 마지막 모드 복원 */
(function(){
  var s=null;try{s=JSON.parse(localStorage.getItem(MODE_KEY)||'null')}catch(e){}
  if(!s||s.god!==selected)return paintModes();
  if(s.mode==='move')goMove();
  else if(s.mode==='fixed'){mode='fixed';paintModes();$('#statusTxt').innerHTML='📍 고정 모드 유지 중 · 움직이면 「이동 모드」, 쉴 때는 「쉬기」'}
  else paintModes();
})();
})();
</script>
</body>
</html>
