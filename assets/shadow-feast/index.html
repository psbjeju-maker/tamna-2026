<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도채비 그림자 대소동</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="hud__score"><small>먹은 그림자</small><strong id="hudScore">0</strong></div>
    <div class="hud__stage" id="hudStage">골목 · 1단계</div>
    <div class="hud__life" id="hudLife" aria-label="목숨 3개"></div>
    <button class="mute" id="mute" type="button" aria-label="소리 끄기">
      <svg viewBox="0 0 24 24" width="20" height="20"><path id="muteIcon" fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
    </button>
  </div>

  <div class="stageCol">
  <div class="boardWrap" id="boardWrap">
    <div class="board" id="board">
      <canvas id="cv" aria-label="위쪽은 그림자와 먹이, 아래쪽은 손전등 조작 영역"></canvas>
      <button class="pad" id="pad" type="button" aria-label="손전등 조작. 드래그하거나 방향키를 쓰세요."></button>
      <div class="toast" id="toast" aria-live="polite">그림을 불러오는 중이에요…</div>
      <div class="panel-wrap" id="overlay">
        <div class="panel" id="panel"><p class="panel__line">그림을 불러오는 중이에요…</p></div>
      </div>
    </div>
  </div>

  <div class="bar">
    <button class="btn btn--primary btn--bar" id="mainBtn" type="button" disabled>준비 중</button>
    <span class="bar__form" id="form">꼬마 그림자 · 시간 제한 없음</span>
  </div>
  </div>
</div>
<script src="game.js?v=1"></script>
</body>
</html>
