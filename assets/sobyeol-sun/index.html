<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소별왕의 가짜 해를 쏴라!</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="hud__cell"><small>남은 시간</small><strong id="hudTime">40</strong></div>
    <div class="hud__cell hud__cell--main"><small>점수</small><strong id="hudScore">0</strong></div>
    <div class="hud__cell"><small>콤보</small><strong id="hudCombo">0</strong></div>
  </div>
  <button class="mute" id="mute" type="button" aria-label="소리 끄기">
    <svg viewBox="0 0 24 24" width="22" height="22"><path id="muteIcon" fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
  </button>
  <button class="skip" id="skip" type="button" hidden>연습 건너뛰기</button>
  <div class="tip" id="tip" hidden></div>

  <div class="panel-wrap" id="overlay">
    <div class="panel" id="panel"><p class="panel__line">그림을 불러오는 중이에요…</p></div>
  </div>
</div>
<script src="game.js?v=1"></script>
</body>
</html>
