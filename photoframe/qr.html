<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>탐라문화제 포토프레임 QR</title>
<style>
@font-face{font-family:"JejuGothic";src:url("../fonts/JejuGothic.woff2") format("woff2")}
*{box-sizing:border-box;margin:0}
body{background:#121c55;color:#fffaf0;font-family:"JejuGothic",sans-serif;min-height:100vh;min-height:100svh;
display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center}
h1{font-size:28px;line-height:1.3;margin-bottom:6px}
h1 em{font-style:normal;color:#f26a1b}
p{font-size:16px;color:rgba(255,250,240,.75);margin-bottom:22px}
.qr{background:#fff;border-radius:24px;padding:14px;width:min(86vw,62svh,440px)}
.qr img{width:100%;display:block}
small{margin-top:18px;font-size:13px;color:rgba(255,250,240,.5);word-break:break-all}
</style></head><body>
<h1>찍은 사진에<br><em>탐라문화제</em> 붙이기</h1>
<p>카메라로 QR을 비춰주세요</p>
<div class="qr"><img src="qr.png" alt="포토프레임 QR"></div>
<small>psbjeju-maker.github.io/tamna-2026/photoframe/</small>
</body></html>
